name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  source:
    uses: Gradient-DS/security-ci/.github/workflows/security-source.yml@2d823df9e1701adb5a3eae257a130d2114c8a5e7 # v3
    secrets: inherit
    permissions:
      contents: read
      issues: write
    with:
      python-paths: 'warren/'
      python-uv: true

  gate:
    needs: [source]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every security job succeeded
        env:
          SOURCE: ${{ needs.source.result }}
        run: |
          echo "source=$SOURCE"
          [ "$SOURCE" = "success" ]
