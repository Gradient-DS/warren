name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  source:
    if: github.event.pull_request.draft != true
    uses: Gradient-DS/security-ci/.github/workflows/security-source.yml@71dea3696135309a19a1541157a249821bc08a2b # v16
    secrets: inherit
    permissions:
      contents: read
    with:
      python-paths: 'warren/'
      python-uv: true

  # Ruff, hygiene hooks, uv-lock, gitleaks and actionlint from .pre-commit-config.yaml;
  # here so the required `gate` enforces it.
  pre-commit:
    if: github.event.pull_request.draft != true
    uses: Gradient-DS/security-ci/.github/workflows/pre-commit.yml@71dea3696135309a19a1541157a249821bc08a2b # v16
    secrets: inherit

  gate:
    needs: [source, pre-commit]
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every security job succeeded
        env:
          SOURCE: ${{ needs.source.result }}
          PRE_COMMIT: ${{ needs.pre-commit.result }}
        run: |
          echo "source=$SOURCE pre-commit=$PRE_COMMIT"
          [ "$SOURCE" = "success" ] && [ "$PRE_COMMIT" = "success" ]
