name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev tools + transport extras
        run: pip install -e ".[dev,rmq,kafka]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        run: python -m pytest tests -q

  bare-install:
    # Locks the no-extras import surface: a bare `pip install .` must keep
    # the package and its config/pubsub sub-packages importable without any
    # transport library present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package without extras
        run: pip install .

      - name: Import surface with no extras
        run: python -c "import warren, warren.runtime.config, warren.pubsub.common, warren.pubsub.rabbitmq, warren.pubsub.kafka"
