name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev tools + transport extras
        run: pip install -e ".[dev,rmq,kafka]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        run: python -m pytest tests -q

  bare-install:
    # Locks the no-extras import surface: a bare `pip install .` must keep
    # the package and its config/pubsub sub-packages importable without any
    # transport library present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package without extras
        run: pip install .

      - name: Import surface with no extras
        run: python -c "import warren, warren.runtime.config, warren.pubsub.common, warren.pubsub.rabbitmq, warren.pubsub.kafka"

      # In a genuinely-bare env neither transport library is installed, so
      # selecting either backend must surface the friendly
      # OptionalDependencyError — not a raw ImportError, and not nothing.
      # Each python -c exits non-zero (failing the job) on any other outcome.
      - name: Backend guards fire as OptionalDependencyError (not raw ImportError)
        run: |
          python -c "
          import sys
          from warren.exceptions import OptionalDependencyError
          from warren.runtime.backends import create_connection_manager
          from warren.runtime.config import RuntimeConfig
          try:
              create_connection_manager(RuntimeConfig(backend='rabbitmq'))
          except OptionalDependencyError:
              print('rabbitmq guard OK')
          except BaseException as e:
              sys.exit('FAIL: rabbitmq raised %s: %s' % (type(e).__name__, e))
          else:
              sys.exit('FAIL: rabbitmq backend raised no error without aio-pika')
          "
          python -c "
          import sys
          from warren.exceptions import OptionalDependencyError
          from warren.runtime.backends import create_connection_manager
          from warren.runtime.config import RuntimeConfig
          try:
              create_connection_manager(RuntimeConfig(backend='kafka'))
          except OptionalDependencyError:
              print('kafka guard OK')
          except BaseException as e:
              sys.exit('FAIL: kafka raised %s: %s' % (type(e).__name__, e))
          else:
              sys.exit('FAIL: kafka backend raised no error without aiokafka')
          "
