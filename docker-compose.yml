# Local infrastructure for the README Quickstart and the bundled examples.
#   docker compose up -d --wait   # start and wait until all services are healthy
#   docker compose down           # stop and remove (add -v to also drop the data volumes)
name: warren

services:
  rabbitmq:
    image: rabbitmq:4
    container_name: warren-rabbitmq
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12

  mongodb:
    image: mongo:8
    container_name: warren-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: warren-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongodb-data:
