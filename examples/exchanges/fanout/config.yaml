rabbitmq:
  # Exchange definitions live in the pipeline spec (pipeline_spec.py),
  # not here — config holds only per-environment infra settings.
  connection:
    host: localhost
    port: 5672
    login: guest
    password: guest
  consumer:
    prefetch_count: 1
    on_shutdown_timeout: 30.0

mongodb:
  host: localhost
  port: 27017
  database: warren_fanout

redis:
  host: localhost
  port: 6379

retry:
  enabled: true
  collection_name: retries

e2e:
  check_timeout_seconds: 60
  check_poll_interval_seconds: 2
