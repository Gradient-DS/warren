backend: kafka

kafka:
  connection:
    bootstrap_servers:
      - localhost:9092
  topic:
    name: jobs
    create_if_missing: true
  consumer:
    auto_offset_reset: earliest

mongodb:
  host: localhost
  port: 27017
  database: e2e_test

redis:
  host: localhost
  port: 6379

retry:
  enabled: true
  collection_name: retries

e2e:
  check_timeout_seconds: 60
  check_poll_interval_seconds: 2
