rabbitmq:
  connection:
    host: localhost
    port: 5672
    login: guest
    password: guest
  exchange:
    name: jobs
    type: fanout
    durable: true
  consumer:
    prefetch_count: 1
    on_shutdown_timeout_seconds: 30.0
  retry:
    enabled: true
    collection_name: retries

mongodb:
  host: localhost
  port: 27017
  database: e2e_test

redis:
  host: localhost
  port: 6379

e2e:
  check_timeout_seconds: 60
  check_poll_interval_seconds: 2
