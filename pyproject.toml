[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warren"
version = "0.2.0"
description = "Message-driven document processing framework — self-selecting workers on a RabbitMQ or Kafka backend with MongoDB/Redis-backed storage"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["rabbitmq", "kafka", "pipeline", "document-processing", "workers", "message-driven", "mongodb", "redis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
]
authors = [{ name = "Gradient DS" }]
dependencies = [
    "visionscaper-pybase>=0.4.0",
    "pymongo>=4.10",
    "redis>=4.0",
    "pydantic>=2.11",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Backend transports and cloud storage are optional: install only the
# extras you use. A missing extra surfaces as an OptionalDependencyError
# the moment that backend / resolver is selected.
rmq = ["aio-pika>=9.5"]
kafka = ["aiokafka>=0.12"]
gcs = ["google-cloud-storage>=2.18"]
dev = [
    "pytest>=8",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Gradient-DS/warren"
Repository = "https://github.com/Gradient-DS/warren"
Issues = "https://github.com/Gradient-DS/warren/issues"
Documentation = "https://github.com/Gradient-DS/warren/blob/main/warren/runtime/USAGE.md"

[project.scripts]
warren-worker = "runtime_scripts.start_worker:main"
warren-job-publication-worker = "runtime_scripts.start_job_publication_worker:main"
warren-job-status-worker = "runtime_scripts.start_job_status_worker:main"
warren-retry-worker = "runtime_scripts.start_retry_worker:main"
warren-purge-queues = "runtime_scripts.purge_queues:main"

[tool.hatch.build.targets.wheel]
packages = ["warren", "runtime_scripts"]
